name: Terraform Plan AWS (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment and Terraform workspace.
        required: true
        type: string
      aws-account-id:
        description: Target AWS account ID.
        required: true
        type: string
      working-directory:
        description: Directory containing the Terraform root module.
        required: false
        type: string
        default: terraform
      runs-on:
        description: Runner label for the plan job.
        required: false
        type: string
        default: arc-runner-set
      terraform-version:
        description: Terraform CLI version.
        required: false
        type: string
        default: 1.10.4
    secrets:
      gh-app-id:
        description: Client ID of the GitHub App used for checkout and private Terraform modules.
        required: true
      gh-app-private-key:
        description: Private key of the GitHub App used for checkout and private Terraform modules.
        required: true
      tf-vars:
        description: Newline-separated KEY=VALUE pairs to export before Terraform runs.
        required: false

jobs:
  plan:
    name: Plan
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.gh-app-id }}
          private-key: ${{ secrets.gh-app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Export caller-provided variables
        shell: bash
        env:
          TF_VARS: ${{ secrets.tf-vars }}
        run: |
          [ -z "$TF_VARS" ] && exit 0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            key=${line%%=*}
            value=${line#*=}
            if [ "$key" = "$line" ]; then
              echo "Ignoring malformed tf-vars entry; expected KEY=VALUE."
              continue
            fi
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done <<< "$TF_VARS"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Assume target AWS account role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/OrganizationAccountAccessRole
          aws-region: eu-north-1
          role-chaining: true
          role-skip-session-tagging: true

      # A relative path would resolve against the caller's checkout, so this
      # action is referenced by its repository path.
      - name: Terraform plan
        uses: datablock-dev/platform-shared/.github/actions/terraform-plan@main
        with:
          environment: ${{ inputs.environment }}
          app-token: ${{ steps.app-token.outputs.token }}
          working-directory: ${{ inputs.working-directory }}
          terraform-version: ${{ inputs.terraform-version }}
