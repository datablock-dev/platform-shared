name: 'Terraform PR Commenter'
description: 'Posts or updates a Pull Request comment with Terraform CI outcomes and outputs.'

inputs:
  fmt-outcome:
    description: 'Outcome of the terraform fmt step'
    required: false
    default: 'unknown'
  init-outcome:
    description: 'Outcome of the terraform init step'
    required: false
    default: 'unknown'
  validate-outcome:
    description: 'Outcome of the terraform validate step'
    required: false
    default: 'unknown'
  validate-stdout:
    description: 'Stdout output from terraform validate'
    required: false
    default: '(no output)'
  plan-outcome:
    description: 'Outcome of the terraform plan step'
    required: false
    default: 'unknown'
  plan-stdout:
    description: 'Stdout output from terraform plan'
    required: false
    default: '(no output)'
  github-token:
    description: 'GitHub token used to make API calls'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Comment plan on PR
      uses: actions/github-script@v7
      env:
        FMT_OUTCOME: ${{ inputs.fmt-outcome }}
        INIT_OUTCOME: ${{ inputs.init-outcome }}
        VALIDATE_OUTCOME: ${{ inputs.validate-outcome }}
        VALIDATE_STDOUT: ${{ inputs.validate-stdout }}
        PLAN_OUTCOME: ${{ inputs.plan-outcome }}
        PLAN_STDOUT: ${{ inputs.plan-stdout }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = '<!-- terraform-ci-results -->';
          const maxLen = 65536;

          const fmtOutcome = process.env.FMT_OUTCOME || 'unknown';
          const initOutcome = process.env.INIT_OUTCOME || 'unknown';
          const validateOutcome = process.env.VALIDATE_OUTCOME || 'unknown';
          const validateStdout = process.env.VALIDATE_STDOUT || '(no output)';
          const planOutcome = process.env.PLAN_OUTCOME || 'unknown';

          const icon = (o) =>
            o === 'success' ? '✅' : o === 'failure' ? '❌' : o === 'skipped' ? '⏭️' : '⚠️';

          function buildBody(plan) {
            return [
              marker,
              '## Terraform CI results',
              '',
              '| Step | Outcome |',
              '| --- | --- |',
              `| Terraform fmt | ${icon(fmtOutcome)} \`${fmtOutcome}\` |`,
              `| Terraform init | ${icon(initOutcome)} \`${initOutcome}\` |`,
              `| Terraform validate | ${icon(validateOutcome)} \`${validateOutcome}\` |`,
              `| Terraform plan | ${icon(planOutcome)} \`${planOutcome}\` |`,
              '',
              '<details><summary>Validate output</summary>',
              '',
              '```',
              validateStdout,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
              '',
              `*Workflow: \`${context.workflow}\`, Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`,
            ].join('\n');
          }

          let planStdout = process.env.PLAN_STDOUT || '(no output)';
          let body = buildBody(planStdout);

          if (body.length > maxLen) {
            const notice = '\n\n... (plan output truncated to fit comment size limit) ...\n\n';
            const overhead = body.length - planStdout.length;
            const budget = Math.max(0, maxLen - overhead - notice.length - 100);
            planStdout = notice + planStdout.slice(-budget);
            body = buildBody(planStdout);
            if (body.length > maxLen) {
              body = body.slice(0, maxLen - 20) + '\n...(truncated)';
            }
          }

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Fail if fmt, validate, or plan failed
      if: ${{ always() }}
      shell: bash
      env:
        FMT_OUTCOME: ${{ inputs.fmt-outcome }}
        VALIDATE_OUTCOME: ${{ inputs.validate-outcome }}
        PLAN_OUTCOME: ${{ inputs.plan-outcome }}
      run: |
        failed=""
        if [ "$FMT_OUTCOME" = "failure" ]; then failed="$failed fmt"; fi
        if [ "$VALIDATE_OUTCOME" = "failure" ]; then failed="$failed validate"; fi
        if [ "$PLAN_OUTCOME" = "failure" ]; then failed="$failed plan"; fi
        if [ -n "$failed" ]; then
          echo "The following Terraform step(s) failed:$failed"
          exit 1
        fi
        echo "fmt, validate, and plan all succeeded (or were skipped)."
