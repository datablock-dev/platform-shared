name: Terraform Plan
description: Run Terraform checks and plan, then comment the results on a pull request.

inputs:
  environment:
    description: Target environment and Terraform workspace (for example, staging or production).
    required: true
  app-token:
    description: GitHub App token for private module access and pull request comments.
    required: true
  terraform-version:
    description: Terraform CLI version.
    required: false
    default: 1.10.4
  working-directory:
    description: Directory containing the Terraform root module.
    required: false
    default: terraform

outputs:
  fmt-outcome:
    description: Outcome of terraform fmt.
    value: ${{ steps.fmt.outputs.outcome }}
  init-outcome:
    description: Outcome of terraform init and workspace selection.
    value: ${{ steps.init.outputs.outcome }}
  validate-outcome:
    description: Outcome of terraform validate.
    value: ${{ steps.validate.outputs.outcome }}
  plan-outcome:
    description: Outcome of terraform plan.
    value: ${{ steps.plan.outputs.outcome }}
  plan-stdout:
    description: Combined standard output and error from terraform plan, truncated when needed for GitHub limits.
    value: ${{ steps.plan.outputs.stdout }}

runs:
  using: composite
  steps:
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Set Terraform plugin cache directory
      shell: bash
      run: |
        mkdir -p "$HOME/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

    - name: Cache Terraform providers
      uses: actions/cache@v6
      with:
        path: ~/.terraform.d/plugin-cache
        key: ${{ runner.os }}-terraform-${{ inputs.environment }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}

    - name: Configure git credentials for private Terraform modules
      shell: bash
      env:
        APP_TOKEN: ${{ inputs.app-token }}
      run: |
        git_config=$(mktemp)
        echo "GIT_CONFIG_GLOBAL=$git_config" >> "$GITHUB_ENV"
        git config --file "$git_config" \
          url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf \
          "https://github.com/"

    - name: Terraform format
      id: fmt
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if terraform fmt -check; then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi

    - name: Terraform init
      id: init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        TF_VAR_github_token: ${{ inputs.app-token }}
      run: |
        if [[ ! "$ENVIRONMENT" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "Environment must contain only letters, numbers, dots, underscores, and hyphens."
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if terraform init -input=false -reconfigure -backend-config="backend-${ENVIRONMENT}.hcl" && \
          (terraform workspace select "$ENVIRONMENT" || terraform workspace new "$ENVIRONMENT"); then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi

    - name: Terraform validate
      id: validate
      if: ${{ steps.init.outputs.outcome == 'success' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if terraform validate -no-color; then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi

    - name: Terraform plan
      id: plan
      if: ${{ steps.init.outputs.outcome == 'success' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_VAR_github_token: ${{ inputs.app-token }}
      run: |
        output_file="$RUNNER_TEMP/terraform-plan.txt"
        if terraform plan -input=false -no-color -out=tfplan > "$output_file" 2>&1; then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi

        cat "$output_file"
        comment_output="$RUNNER_TEMP/terraform-plan-comment.txt"
        if [ "$(wc -c < "$output_file")" -gt 60000 ]; then
          {
            echo "... (plan output truncated to fit GitHub output and comment limits) ..."
            echo
            tail -c 58000 "$output_file"
          } > "$comment_output"
        else
          cp "$output_file" "$comment_output"
        fi

        delimiter="TF_PLAN_$(openssl rand -hex 8)"
        {
          echo "stdout<<$delimiter"
          cat "$comment_output"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: Post pull request comment
      uses: actions/github-script@v9
      if: ${{ always() && github.event_name == 'pull_request' }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FMT_OUTCOME: ${{ steps.fmt.outputs.outcome }}
        INIT_OUTCOME: ${{ steps.init.outputs.outcome }}
        VALIDATE_OUTCOME: ${{ steps.validate.outputs.outcome }}
        PLAN_OUTCOME: ${{ steps.plan.outputs.outcome }}
        PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
      with:
        github-token: ${{ inputs.app-token }}
        script: |
          const environment = process.env.ENVIRONMENT;
          const workingDirectory = process.env.WORKING_DIRECTORY;
          const marker = `<!-- terraform-plan:${environment}:${workingDirectory} -->`;
          const maxLength = 65536;
          const outcome = (name) => process.env[name] || 'skipped';
          const icon = (value) => value === 'success' ? '✅' : value === 'failure' ? '❌' : '⏭️';

          function buildBody(planOutput) {
            return [
              marker,
              `## Terraform Plan — \`${environment}\``,
              '',
              '| Step | Outcome |',
              '| --- | --- |',
              `| Format | ${icon(outcome('FMT_OUTCOME'))} \`${outcome('FMT_OUTCOME')}\` |`,
              `| Init | ${icon(outcome('INIT_OUTCOME'))} \`${outcome('INIT_OUTCOME')}\` |`,
              `| Validate | ${icon(outcome('VALIDATE_OUTCOME'))} \`${outcome('VALIDATE_OUTCOME')}\` |`,
              `| Plan | ${icon(outcome('PLAN_OUTCOME'))} \`${outcome('PLAN_OUTCOME')}\` |`,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```',
              planOutput,
              '```',
              '',
              '</details>',
              '',
              `*@${context.actor} · \`${context.eventName}\` · workspace: \`${environment}\`*`,
            ].join('\n');
          }

          let planOutput = process.env.PLAN_STDOUT || '(plan was not run)';
          let body = buildBody(planOutput);
          if (body.length > maxLength) {
            const notice = '\n\n... (plan output truncated to fit the comment limit) ...\n\n';
            const overhead = body.length - planOutput.length;
            const budget = Math.max(0, maxLength - overhead - notice.length - 100);
            planOutput = notice + planOutput.slice(-budget);
            body = buildBody(planOutput);
          }

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((comment) => comment.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Check Terraform outcomes
      if: ${{ always() }}
      shell: bash
      env:
        FMT_OUTCOME: ${{ steps.fmt.outputs.outcome }}
        INIT_OUTCOME: ${{ steps.init.outputs.outcome }}
        VALIDATE_OUTCOME: ${{ steps.validate.outputs.outcome }}
        PLAN_OUTCOME: ${{ steps.plan.outputs.outcome }}
      run: |
        failed=""
        for step in FMT INIT VALIDATE PLAN; do
          variable="${step}_OUTCOME"
          value="${!variable:-skipped}"
          if [ "$value" != "success" ]; then
            failed="$failed ${step,,}"
          fi
        done

        if [ -n "$failed" ]; then
          echo "The following Terraform steps failed or were skipped:$failed"
          exit 1
        fi
