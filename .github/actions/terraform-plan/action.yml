name: Terraform Plan
description: Run Terraform checks and plan, then comment the results on a pull request.

inputs:
  environment:
    description: Target environment and Terraform workspace (for example, staging or production).
    required: true
  aws-oidc-role-arn:
    description: AWS OIDC role ARN. AWS authentication is skipped unless this and aws-account-id are set.
    required: false
    default: ""
  aws-account-id:
    description: Target AWS account ID. AWS authentication is skipped unless this and aws-oidc-role-arn are set.
    required: false
    default: ""
  app-token:
    description: Existing token for private modules and PR comments when App credentials are not provided.
    required: false
    default: ${{ github.token }}
  app-id:
    description: GitHub App client ID. Must be provided with app-private-key to create a token and check out the repository.
    required: false
    default: ""
  app-private-key:
    description: GitHub App private key. Must be provided with app-id to create a token and check out the repository.
    required: false
    default: ""
  terraform-version:
    description: Terraform CLI version.
    required: false
    default: 1.10.4
  working-directory:
    description: Directory containing the Terraform root module.
    required: false
    default: terraform
  summary:
    description: Post the Terraform results as a pull request comment.
    required: false
    default: "true"

outputs:
  fmt-outcome:
    description: Outcome of terraform fmt.
    value: ${{ steps.fmt.outputs.outcome }}
  init-outcome:
    description: Outcome of terraform init and workspace selection.
    value: ${{ steps.init.outputs.outcome }}
  validate-outcome:
    description: Outcome of terraform validate.
    value: ${{ steps.validate.outputs.outcome }}
  plan-outcome:
    description: Outcome of terraform plan.
    value: ${{ steps.plan.outputs.outcome }}
  plan-stdout:
    description: Combined standard output and error from terraform plan, truncated when needed for GitHub limits.
    value: ${{ steps.plan.outputs.stdout }}

runs:
  using: composite
  steps:
    - name: Validate GitHub App inputs
      if: ${{ (inputs.app-id == '' && inputs.app-private-key != '') || (inputs.app-id != '' && inputs.app-private-key == '') }}
      shell: bash
      run: |
        echo "app-id and app-private-key must be provided together."
        exit 1

    - uses: actions/create-github-app-token@v3.2.0
      id: app-token
      if: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}

    - uses: actions/checkout@v7
      if: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
      with:
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: false
        clean: false

    - name: Configure AWS credentials
      if: ${{ inputs.aws-oidc-role-arn != '' && inputs.aws-account-id != '' }}
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        role-to-assume: ${{ inputs.aws-oidc-role-arn }}
        aws-region: eu-north-1
        role-session-name: GitHubActions-${{ github.run_id }}

    - name: Assume target AWS account role
      if: ${{ inputs.aws-oidc-role-arn != '' && inputs.aws-account-id != '' }}
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/OrganizationAccountAccessRole
        aws-region: eu-north-1
        role-chaining: true
        role-skip-session-tagging: true

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Set Terraform plugin cache directory
      shell: bash
      run: |
        mkdir -p "$HOME/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

    - name: Cache Terraform providers
      uses: actions/cache@v6
      with:
        path: ~/.terraform.d/plugin-cache
        key: ${{ runner.os }}-terraform-${{ inputs.environment }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}

    - name: Configure git credentials for private Terraform modules
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token || inputs.app-token }}
      run: |
        git_config=$(mktemp)
        echo "GIT_CONFIG_GLOBAL=$git_config" >> "$GITHUB_ENV"
        git config --file "$git_config" \
          url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf \
          "https://github.com/"

    - name: Terraform format
      id: fmt
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if terraform fmt -check; then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi

    - name: Terraform init
      id: init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        TF_VAR_github_token: ${{ steps.app-token.outputs.token || inputs.app-token }}
      run: |
        if [[ ! "$ENVIRONMENT" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "Environment must contain only letters, numbers, dots, underscores, and hyphens."
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if terraform init -input=false -reconfigure -backend-config="backend-${ENVIRONMENT}.hcl" && \
          (terraform workspace select "$ENVIRONMENT" || terraform workspace new "$ENVIRONMENT"); then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi

    - name: Terraform validate
      id: validate
      if: ${{ steps.init.outputs.outcome == 'success' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        output_file="$RUNNER_TEMP/terraform-validate.txt"
        if terraform validate -no-color > "$output_file" 2>&1; then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi

        cat "$output_file"
        delimiter="TF_VALIDATE_$(openssl rand -hex 8)"
        {
          echo "stdout<<$delimiter"
          cat "$output_file"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: Terraform plan
      id: plan
      if: ${{ steps.init.outputs.outcome == 'success' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_VAR_github_token: ${{ steps.app-token.outputs.token || inputs.app-token }}
      run: |
        output_file="$RUNNER_TEMP/terraform-plan.txt"
        if terraform plan -input=false -no-color -out=tfplan > "$output_file" 2>&1; then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi

        cat "$output_file"
        comment_output="$RUNNER_TEMP/terraform-plan-comment.txt"
        if [ "$(wc -c < "$output_file")" -gt 60000 ]; then
          {
            echo "... (plan output truncated to fit GitHub output and comment limits) ..."
            echo
            tail -c 58000 "$output_file"
          } > "$comment_output"
        else
          cp "$output_file" "$comment_output"
        fi

        delimiter="TF_PLAN_$(openssl rand -hex 8)"
        {
          echo "stdout<<$delimiter"
          cat "$comment_output"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: Check Terraform outcomes
      if: ${{ always() }}
      shell: bash
      env:
        FMT_OUTCOME: ${{ steps.fmt.outputs.outcome }}
        INIT_OUTCOME: ${{ steps.init.outputs.outcome }}
        VALIDATE_OUTCOME: ${{ steps.validate.outputs.outcome }}
        PLAN_OUTCOME: ${{ steps.plan.outputs.outcome }}
      run: |
        failed=""
        for step in FMT INIT VALIDATE PLAN; do
          variable="${step}_OUTCOME"
          value="${!variable:-skipped}"
          if [ "$value" != "success" ]; then
            failed="$failed ${step,,}"
          fi
        done

        if [ -n "$failed" ]; then
          echo "The following Terraform steps failed or were skipped:$failed"
          exit 1
        fi

    - name: Comment plan on PR
      if: ${{ always() && inputs.summary == 'true' && github.event_name == 'pull_request' }}
      uses: datablock-dev/platform-shared/.github/actions/terraform-pr-summary@main
      with:
        fmt-outcome: ${{ steps.fmt.outputs.outcome }}
        init-outcome: ${{ steps.init.outputs.outcome }}
        validate-outcome: ${{ steps.validate.outputs.outcome }}
        validate-stdout: ${{ steps.validate.outputs.stdout }}
        plan-outcome: ${{ steps.plan.outputs.outcome }}
        plan-stdout: ${{ steps.plan.outputs.stdout }}
        github-token: ${{ steps.app-token.outputs.token || inputs.app-token }}
